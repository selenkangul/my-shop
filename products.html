  <h1>Products</h1>

  <!-- Top-level category buttons -->

    <button data-category="all" class="active">View All</button>
    <button data-category="earrings">Earrings</button>
    <button data-category="home-decor">Home Decorations</button>
  </div>

  <!-- Sub-category buttons, only shown when "Home Decorations" is selected -->

    <button data-subcategory="vase">Vases</button>

      {

      {

        detailPage: "products/Earringblackgoldorganic.html"
      },
      {

        image: "images/Earring-black-gold-rock-1.png",

        detailPage: "products/Earringblackgoldrock1.html"
      },
      {
        name: "Gold flake series",
        variant: "Black | Rock 2",

        category: "earrings",
        subcategory: null,
        stripeLink: "https://buy.stripe.com/TODO_earring_rock2",
        detailPage: "products/Earringblackgoldrock2.html"
      },
      {
        name: "Gold flake series",
        variant: "Black | Asymetric",
        price: 35.00,
        image: "images/Earring-black-gold-asymetric-1.png",
        category: "earrings",
        subcategory: null,
        stripeLink: "https://buy.stripe.com/TODO_earring_asymetric",
        detailPage: "products/Earringblackgoldasymetric.html"
      },
      {

      {

      {

      {

        variant: "Black | Drops",
        price: 35.00,
        image: "images/Earring-black-gold-drops-1.png",
        category: "earrings",
        subcategory: null,
        stripeLink: "https://buy.stripe.com/TODO_earring_drops",
        detailPage: "products/Earringblackgolddrops.html"
      }
      // ...add more products here
    ];

    let activeCategory = "all";
    let activeSubcategory = "all";

    function renderProducts() {
      const grid = document.getElementById("product-grid");

      const filtered = products.filter((p) => {
        if (activeCategory === "all") return true;
        if (p.category !== activeCategory) return false;
        if (activeCategory === "home-decor" && activeSubcategory !== "all") {
          return p.subcategory === activeSubcategory;
        }
        return true;
      });

      grid.innerHTML = filtered
        .map(
          (p) => `
        <a href="${p.detailPage}">
          <img src="${p.image}" width="200" alt="${p.name} ${p.variant}">
          <p class="product-title">${p.name}</p>
          ${p.variant ? `<p class="variant">${p.variant}</p>` : ""}
          <p class="price">CHF ${p.price.toFixed(2)}</p>
        </a>
      `
        )
        .join("");
    }

    // Top-level filter buttons
    document.querySelectorAll("#main-filters button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document
          .querySelectorAll("#main-filters button")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");

        activeCategory = btn.dataset.category;
        activeSubcategory = "all";

        document.getElementById("sub-filters").style.display =
          activeCategory === "home-decor" ? "flex" : "none";
        document
          .querySelectorAll("#sub-filters button")
          .forEach((b) => b.classList.remove("active"));
        document.querySelector('#sub-filters button[data-subcategory="all"]')
          .classList.add("active");

        renderProducts();
      });
    });

    // Sub-category filter buttons
    document.querySelectorAll("#sub-filters button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document
          .querySelectorAll("#sub-filters button")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeSubcategory = btn.dataset.subcategory;
        renderProducts();
      });
    });

    renderProducts();
  </script>
